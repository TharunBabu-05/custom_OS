y="166" font-family="Arial,sans-serif" font-size="17" fill="#9ab0c5">Timer + console</text><text x="791" y="204" font-family="monospace" font-size="11" letter-spacing="1" fill="#7193a9">FREESTANDING C</text><path d="M1002 148h14m-5-5 5 5-5 5" fill="none" stroke="#65e6bb"/><rect x="1020" y="67" width="226" height="162" rx="12" fill="#111f30" stroke="#2a4256"/><text x="1038" y="98" font-family="monospace" font-size="16" fill="#65e6bb">05</text><text x="1038" y="133" font-family="Arial,sans-serif" font-weight="700" font-size="21" fill="#e1edf9">MONITOR</text><text x="1038" y="166" font-family="Arial,sans-serif" font-size="17" fill="#9ab0c5">Commands over TTL</text><text x="1038" y="204" font-family="monospace" font-size="11" letter-spacing="1" fill="#7193a9">INTERACTIVE EL1</text>
