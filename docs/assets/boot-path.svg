<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="264" viewBox="0 0 1280 264" role="img" aria-labelledby="title desc"><title id="title">The boot path</title><desc id="desc">Five implemented stages: firmware loads the image and DTB; AArch64 entry sets up the CPU; board attaches UART; kernel initializes the timer and console; the monitor handles serial commands.</desc>
<rect width="1280" height="264" rx="20" fill="#0b1421"/>
<text x="36" y="39" font-family="monospace" font-size="13" letter-spacing="3" fill="#718fa5">ONE BOOT. FIVE BOUNDARIES. OWNED IN SOURCE.</text>
