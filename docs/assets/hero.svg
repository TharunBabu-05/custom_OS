<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="570" viewBox="0 0 1280 570" role="img" aria-labelledby="title desc"><title id="title">OurOS — from first instruction to real silicon</title><desc id="desc">An original AArch64 kernel. Physical Raspberry Pi 5 boot observed over a CP2102 serial console. Animated circuit artwork.</desc>
